name: Publish approved TCN newsroom content
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tcn-newsroom-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch approved content from private newsroom backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEWSROOM_PUBLISH_SECRET: ${{ secrets.NEWSROOM_PUBLISH_SECRET }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing repository secret SUPABASE_URL" && exit 1)
          test -n "$NEWSROOM_PUBLISH_SECRET" || (echo "Missing repository secret NEWSROOM_PUBLISH_SECRET" && exit 1)
          curl --fail --silent --show-error \
            -H "x-newsroom-publish-secret: $NEWSROOM_PUBLISH_SECRET" \
            "$SUPABASE_URL/functions/v1/publish-queue" \
            -o published-content.json
      - name: Generate static article pages
        run: node scripts/publish-newsroom.mjs
      - name: Commit public newsroom feed and article pages
        run: |
          git config user.name "TCN Newsroom Publisher"
          git config user.email "newsroom-publisher[bot]@users.noreply.github.com"
          git add published-content.json published-articles
          if git diff --cached --quiet; then
            echo "No newsroom changes to publish."
          else
            git commit -m "Publish approved newsroom content"
            git push origin HEAD:main
          fi
